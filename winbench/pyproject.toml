[project]
name = "winbench"
version = "0.1.0"
description = "Cross-platform (Windows-first) replacement for frappe's `bench` CLI: no supervisor, no nginx, no gunicorn, Postgres-only."
requires-python = ">=3.11,<3.13"
dependencies = [
    "click>=8.1",
    "waitress>=3.0",
    "psycopg2-binary>=2.9",
    "redis>=4.5,<5",
    "rq>=1.15,<2",
    "psutil>=5.9",
]

[project.scripts]
winbench = "winbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
