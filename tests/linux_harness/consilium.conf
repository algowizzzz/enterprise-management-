# The configuration the Linux rehearsal used: consilium.conf.example with the
# values of the rehearsal host filled in. Nothing else was edited.
[site]
name = governance.example.internal
hostname = governance.example.internal
admin_email = governance-admin@example.internal
timezone = Europe/London
admin_password_file = /etc/consilium/secrets/admin_password

[paths]
install_dir = /opt/consilium

[service]
user = consilium
group = consilium
manage_services = auto

[database]
host = cons-pg
port = 5432
name = consilium
password_file = /etc/consilium/secrets/db_password
provisioning = superuser
root_user = postgres
root_password_file = /etc/consilium/secrets/db_root_password

[redis]
cache_url = redis://cons-redis:6379/0
queue_url = redis://cons-redis:6379/1

[web]
port = 8000
threads = 8
background_workers = 2
socketio = no

[tls]
proxy = nginx
cert_file = /etc/pki/tls/certs/governance.example.internal.crt
key_file = /etc/pki/tls/private/governance.example.internal.key
https_port = 443
http_port = 80

[email]
enabled = no

[sso]
mode = none
allow_signup = no

[assistant]
ai_enabled = no

[backup]
dir = /var/backups/consilium
retention_days = 14
schedule = *-*-* 02:30:00
