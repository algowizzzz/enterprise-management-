# Generated by the Consilium deployment kit from deploy/service/nginx/.
# TLS termination in front of the application server. Installed as
# /etc/nginx/conf.d/consilium.conf; checked with `nginx -t` before reload.
#
# The application server listens on 127.0.0.1:8000 only, so this proxy is
# the one way in. It needs no access to the installation directory: the
# application serves its own /assets and /files.

upstream consilium_web {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Plain HTTP answers only with a redirect.
server {
    listen 80;
    listen [::]:80;
    server_name governance.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name governance.example.internal;

    ssl_certificate     /etc/pki/tls/certs/governance.example.internal.crt;
    ssl_certificate_key /etc/pki/tls/private/governance.example.internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:consilium_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Attachments and imports.
    client_max_body_size 50m;
    # Reports and exports can take a while.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;


    location / {
        proxy_pass http://consilium_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
    }
}
