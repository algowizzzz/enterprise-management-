# Generated by the Consilium deployment kit from deploy/service/nginx/.
# TLS termination in front of the application server. Installed as
# /etc/nginx/conf.d/consilium.conf; checked with `nginx -t` before reload.
#
# The application server listens on 127.0.0.1:@WEB_PORT@ only, so this proxy is
# the one way in. It needs no access to the installation directory: the
# application serves its own /assets and /files.

upstream consilium_web {
    server 127.0.0.1:@WEB_PORT@;
    keepalive 16;
}

# Plain HTTP answers only with a redirect.
server {
    listen @HTTP_PORT@;
    listen [::]:@HTTP_PORT@;
    server_name @HOSTNAME@;
    return 301 https://$host@HTTPS_PORT_SUFFIX@$request_uri;
}

server {
    listen @HTTPS_PORT@ ssl http2;
    listen [::]:@HTTPS_PORT@ ssl http2;
    server_name @HOSTNAME@;

    ssl_certificate     @CERT_FILE@;
    ssl_certificate_key @KEY_FILE@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:consilium_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Attachments and imports.
    client_max_body_size 50m;
    # Reports and exports can take a while.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

@IF_SOCKETIO@    location /socket.io {
@IF_SOCKETIO@        proxy_pass http://127.0.0.1:@SOCKETIO_PORT@;
@IF_SOCKETIO@        proxy_http_version 1.1;
@IF_SOCKETIO@        proxy_set_header Upgrade $http_upgrade;
@IF_SOCKETIO@        proxy_set_header Connection "upgrade";
@IF_SOCKETIO@        proxy_set_header Host $host;
@IF_SOCKETIO@        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
@IF_SOCKETIO@    }

    location / {
        proxy_pass http://consilium_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
    }
}
